name: Atualização completa (Claude)

# Opcional. Só funciona depois de cadastrar a chave da API da Anthropic em
# Settings > Secrets and variables > Actions > New repository secret, com o nome ANTHROPIC_API_KEY.
# Cada execução consome créditos da API.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  completo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Varrer sites de concurso
        run: python scripts/raspar_pci.py || echo "varredura falhou; segue com os dados anteriores"
        env:
          TZ: America/Fortaleza
      - name: Claude revisa previstos, bancas e datas
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "Leia e siga as instrucoes do arquivo scripts/prompt_atualizar.md" --allowedTools "Read,Glob,Grep,Edit,Write,WebSearch,WebFetch,Bash(python scripts/gerar_plano.py)" --permission-mode acceptEdits
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: America/Fortaleza
      - name: Gerar as visões do app
        run: python scripts/gerar_plano.py index.html --app
        env:
          TZ: America/Fortaleza
      - name: Guardar dados no repositório
        run: |
          git config user.name "atualizador-concursos"
          git config user.email "atualizador-concursos@users.noreply.github.com"
          git add -A
          git commit -m "Atualização completa $(TZ=America/Fortaleza date +'%d/%m/%Y %H:%M')" || exit 0
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publicar
        uses: actions/deploy-pages@v4
